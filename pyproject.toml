[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papersynth"
version = "0.1.0"
description = "Multi-paper implementation spec synthesizer: N papers in, one verified contradiction-annotated spec out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daksha1611", email = "mehtadaksha1611@gmail.com" }]
keywords = ["research", "papers", "specification", "llm", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "networkx>=3.3",
  "rapidfuzz>=3.9",
  "tenacity>=8.3",
  "rich>=13.7",
]

[project.optional-dependencies]
api        = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "sse-starlette>=2.1"]
embed      = ["sentence-transformers>=3.0"]
vectors    = ["chromadb>=0.5"]
groq       = ["groq>=0.9"]
gemini     = ["google-genai>=0.3"]
math       = ["nougat-ocr>=0.1.17", "pix2tex>=0.1.2", "pdf2image>=1.17"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.103",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
papersynth = "papersynth.cli:app"

[project.entry-points."papersynth.extractors"]
# third-party extractors register here

[project.urls]
Homepage = "https://github.com/Daksha1611/papersynth"
Issues = "https://github.com/Daksha1611/papersynth/issues"

[tool.hatch.build.targets.wheel]
packages = ["papersynth"]

[tool.hatch.build]
include = ["papersynth/**/*.py", "papersynth/**/*.json", "papersynth/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# These modules deliberately contain the confusable characters they exist to
# normalize away (ligatures, smart quotes) or to detect (math glyphs).
# RUF001 flagging them as ambiguous is exactly backwards here.
"papersynth/ingest/base.py" = ["RUF001"]
"papersynth/ingest/pdf.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: hits a real LLM provider; excluded from default runs",
  "integration: requires external services (GROBID)",
]
