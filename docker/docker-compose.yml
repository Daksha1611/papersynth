# Section 15.3. `docker compose up` gives a working PDF path without
# installing Java, GROBID or poppler on the host.

services:
  grobid:
    image: lfoppiano/grobid:0.8.1
    ports: ["8070:8070"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 15s
      timeout: 10s
      retries: 8
      # GROBID loads models on boot and is unreachable for a while; without
      # this, dependent services start against a server that 503s.
      start_period: 60s

  papersynth:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      grobid:
        condition: service_healthy
    env_file: [../.env]
    environment:
      PAPERSYNTH_GROBID_URL: http://grobid:8070
      PAPERSYNTH_WORKSPACE: /app/runs
    volumes:
      # Runs are the deliverable and must outlive the container.
      - ../runs:/app/runs
      # Policy and checklists are edited far more often than code, so they are
      # mounted rather than baked in.
      - ../config:/app/config:ro
    # Overridden per invocation:
    #   docker compose run --rm papersynth doctor
    #   docker compose run --rm papersynth run --papers ... --out runs/x
    command: ["doctor"]

  # Server-backed stores, deferred to P3 (DD-05). Not started by default.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: [prod]
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  neo4j:
    image: neo4j:5-community
    profiles: [prod]
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-papersynth}"
    volumes: ["neo4j_data:/data"]

volumes:
  qdrant_data: {}
  neo4j_data: {}
